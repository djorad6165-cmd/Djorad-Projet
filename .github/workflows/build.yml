name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip python3-pip git
          pip install --upgrade pip
          pip install buildozer Cython==0.29.33
          
      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = DJOSSABA Agro
          package.name = djossabaagro
          package.domain = com.djossaba.agro
          source.dir = .
          source.include_exts = py
          version = 1.0
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          [buildozer]
          log_level = 2
          [app:android]
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.sdk = 33
          android.ndk = 25b
          android.accept_sdk_license_agreement = True
          p4a.bootstrap = sdl2
          EOF
          
      - name: Build APK - First attempt to download SDK
        run: |
          buildozer android debug || true
          
      - name: Accept all Android licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager | head -1)
          echo "Found sdkmanager at $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          yes | $SDKMANAGER "build-tools;33.0.2" "platform-tools" || true
          
      - name: Build APK - Final build
        run: |
          buildozer android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJOSSABA-APK
          path: bin/*.apk
