name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip python3-pip git
          pip install --upgrade pip
          pip install buildozer Cython==0.29.33

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = DJOSSABA Agro
          package.name = djossabaagro
          package.domain = com.djossaba.agro
          source.dir = .
          source.include_exts = py
          version = 1.0
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          [buildozer]
          log_level = 2
          [app:android]
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.sdk = 33
          android.ndk = 25b
          android.build_tools_version = 33.0.2
          android.accept_sdk_license_agreement = True
          p4a.bootstrap = sdl2
          EOF
          cat buildozer.spec

      - name: Build APK with manual license fix
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android debug || true
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1051b8ea4b044" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "y" > $ANDROID_HOME/licenses/android-sdk-preview-license
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager | head -1)
          echo "SDKMANAGER=$SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          yes | $SDKMANAGER "build-tools;33.0.2" "build-tools;37.0.0" || true
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJOSSABA-APK
          path: bin/*.apk
